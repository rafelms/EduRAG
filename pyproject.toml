[project]
name = "edurag"
version = "0.1.0"
description = "API de perguntas e respostas sobre PDFs educacionais, com citação de página"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.33",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.6",
    "psycopg[binary]>=3.3.7",
    "alembic>=1.20.1",
    "pgvector>=0.3",
    "httpx>=0.27",
    "pypdf>=6.21.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=5.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false
exclude-newer = "7 days"
# Isenção temporária: pypdf 6.21.4 (fix de CVE-2026-119203..119209) e o mínimo
# python-multipart>=0.0.33 têm menos de 7 dias. Remover depois de 07/11/2026 11:23 (BRT).
exclude-newer-package = { pypdf = false, python-multipart = false }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
