name: CI

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  backend:
    runs-on: ubuntu-24.04
    services: 
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: edurag
          POSTGRES_PASSWORD: edurag
          POSTGRES_DB: edurag_test
        ports: 
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edurag -d edurag_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Instalar uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e #v10.3.2
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check . 

      - name: Ruff (formatação)
        run: uv run ruff format --check . 

      - name: Testes
        run: uv run pytest --cov=app --cov-report=xml
        env: 
          TEST_DATABASE_URL: postgresql+psycopg://edurag:edurag@localhost:5432/edurag_test

      - name: Enviar cobertura
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
        with:
          name: Coverage
          path: coverage.xml


  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Instalar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

