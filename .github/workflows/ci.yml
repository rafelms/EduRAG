name: CI

on:
  push:
  pull_request:
    branches:
    - main


jobs:
  backend:
    runs-on: ubuntu-24.04
    services: 
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: edurag
          POSTGRES_PASSWORD: edurag
          POSTGRES_DB: edurag_test
        ports: 
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edurag -d edurag_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check . 

      - name: Ruff (formatação)
        run: uv run ruff format --check . 

      - name: Testes
        run: uv run pytest --cov=app --cov-report=xml
        env: 
          TEST_DATABASE_URL: postgresql+psycopg://edurag:edurag@localhost:5432/edurag_test

      - name: Enviar cobertura
        uses: actions/upload-artifact@v7
        with:
          name: Coverage
          path: coverage.xml
