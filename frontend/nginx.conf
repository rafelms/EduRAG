server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Acima do MAX_UPLOAD_MB da API, para o erro 413 vir dela, com mensagem clara.
    client_max_body_size 25m;

    # Repassa /api/* para a API sem o prefixo: /api/documents -> /documents.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A geração no Ollama pode levar até LLM_TIMEOUT_SECONDS (300 s).
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
    }

    # Arquivos com hash no nome podem ficar em cache para sempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
